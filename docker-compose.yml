services:
  postgres:
    image: postgres:16-alpine
    container_name: taskly_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local SMTP server that catches every email: web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: taskly_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web inbox

volumes:
  postgres_data:
